<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 280px; margin: 12px; }
  input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
  button { width: 100%; padding: 8px; background: #3b5bdb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  small { color: #666; display: block; margin-top: 8px; }
</style>
</head>
<body>
  <b>Playtoon</b>
  <label>Engine URL<input id="ep" placeholder="http://localhost:8765"></label>
  <button id="go">Read questions on this tab</button>
  <small>Only this tab is read, until it is reloaded or closed. A red ON badge shows while reading is active.</small>
  <small id="status"></small>
  <script src="popup.js"></script>
</body>
</html>
